name: Check

# Gate every pull request on typecheck + lint + tests + build, without deploying. deploy.yml runs the
# same steps, but only on a push to main — so until now a PR was checked by nothing, and a red build
# surfaced on the deploy of the merge, not on the branch.

on:
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
