<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Ported from playhook's launcher CSP, but retargeted: there everything arrives as data: URLs from
         the main process, here every asset is a same-origin relative URL. 'unsafe-inline' is deliberately
         absent — style-src governs <style> tags and style="..." attributes, not CSSOM writes, and the
         palette/hero code only ever writes through the CSSOM (element.style.setProperty).
         `connect-src 'self'` is what lets the page fetch its own collection feed (api/v1/index.json):
         default-src 'none' covers connect-src too, and without this the fetch fails with nothing on
         screen but an empty list — see collection.ts.
         `blob:` on img-src and media-src is what a file the user picks in "Add game" becomes: the
         browser mints a blob URL for it, and without these two the cover and the music of an entry made
         on this page would be blocked. It admits nothing from the network — a blob URL can only name
         something this document itself created. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self' blob:; media-src 'self' blob:; style-src 'self'; font-src 'self'; script-src 'self'; connect-src 'self';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Playhook - bring console vibes to your PC</title>
    <meta
      name="description"
      content="Playhook is a background launcher that detects games on an external device, syncs saves and tracks playtime. Plus a collection of ready-made game.json manifests."
    />
    <link rel="icon" href="./favicon.png" />
    <!-- The hero cross-fade assumes an image that is already decodable (in the launcher it is a data URL).
         Preloading keeps the first fade from playing over an empty layer — see main.ts. -->
    <link rel="preload" as="image" href="./wallpaper.webp" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="app" data-route="home">
      <!-- Hero background: two stacked layers behind all UI (z-index only on the container, see
           styles.css). JS writes the image + pan into the idle layer and cross-fades it in, GTA-5-style.
           #hero carries the screen zoom (fast, on entering an entry), #hero-pan the carousel parallax
           (slow) — one element could only carry one transform at one speed. -->
      <div id="hero">
        <div id="hero-pan">
          <div class="hero-layer"></div>
          <div class="hero-layer"></div>
        </div>
      </div>

      <!-- The collection carousel (the `carousel` screen): a horizontal strip of covers sliding under a
           fixed anchor, over the landing page. Cards are built from JS (carousel.ts); a cover is loaded
           only once its card comes near the selection. -->
      <div id="carousel" aria-hidden="true">
        <div id="carousel-strip">
          <!-- The focus indicator: a soft body UNDER the covers, drawn on a canvas that rides inside the
               strip, so it inherits the row's slide and its fades (focus-jelly.ts). -->
          <canvas id="carousel-jelly" aria-hidden="true"></canvas>
        </div>
      </div>

      <!-- Bottom bar, ported from the launcher: the two-line title+status block, More on the right, and
           Play in the left slot — shown only on a game screen, exactly as the launcher hides it on its
           idle screen. Unlike the launcher both text lines are ALWAYS visible here, and their text is
           inlined so there is no empty frame before the script runs. -->
      <footer id="bottom-bar">
        <div class="bar-content">
          <!-- Play: the launcher's own button. There is no window.api on a web page and nothing is
               started; what it drives is a PRETEND session (session.ts) that walks the same phases the
               launcher does, so the bar behaves the way the product's does. Force close, in the menu,
               ends it. -->
          <button id="play-button" class="play-button" type="button" aria-label="Play">
            <!-- Play triangle with rounded corners (quadratic beziers through each vertex, ~6-unit
                 edge offset) so it matches the 10px-radius language of the rest of the UI. -->
            <svg class="icon-play" viewBox="0 0 36 48" aria-hidden="true">
              <path
                d="M6.94 5.4 L29.06 20.6 Q34 24 29.06 27.4 L6.94 42.6 Q2 46 2 40 L2 8 Q2 2 6.94 5.4 Z"
              />
            </svg>
            <!-- The spinner arc that replaces the triangle while a session is launching or closing
                 down (see session.ts). The launcher also has a gear here for install/uninstall — the
                 site installs nothing. -->
            <span class="loader" aria-hidden="true"></span>
          </button>

          <div id="status" class="status">Bring console vibes to your PC</div>
          <div id="title" class="title">Playhook</div>

          <!-- More button: same rect-button component (invert-on-hover), three dots. Opens the menu. -->
          <button id="more-button" class="rect-button" type="button" aria-label="More">
            <svg class="icon-more" viewBox="0 0 56 16" aria-hidden="true">
              <path
                d="M8 0C12.4183 0 16 3.58172 16 8C16 12.4183 12.4183 16 8 16C3.58172 16 0 12.4183 0 8C0 3.58172 3.58172 0 8 0Z"
              />
              <path
                d="M28 0C32.4183 0 36 3.58172 36 8C36 12.4183 32.4183 16 28 16C23.5817 16 20 12.4183 20 8C20 3.58172 23.5817 0 28 0Z"
              />
              <path
                d="M48 0C52.4183 0 56 3.58172 56 8C56 12.4183 52.4183 16 48 16C43.5817 16 40 12.4183 40 8C40 3.58172 43.5817 0 48 0Z"
              />
            </svg>
          </button>
        </div>
      </footer>

      <!-- Library: the whole catalogue as a grid of covers, opened by the Library card at the tail of the
           strip. Structurally the launcher's screen (veil + column + sidebar), whose pane runs to the
           RIGHT EDGE of the screen so the gap after the sidebar and the gap before the edge read as
           equal. #library-empty sits OUTSIDE the scroller on purpose: screen-scroller measures the
           pane's last child, and a hidden node at the tail would zero the bottom fade. -->
      <section id="library" class="settings" aria-hidden="true">
        <div class="settings-veil"></div>
        <div class="settings-column">
          <div class="settings-header">
            <div class="settings-title">Library</div>
          </div>
          <div class="settings-body">
            <div class="settings-nav" id="library-nav"></div>
            <div class="library-pane">
              <!-- The grid's focus body, the strip's twin. It sits OUTSIDE the scroller on purpose: a
                   canvas as tall as a catalogue of hundreds would cost tens of megabytes, so this one is
                   the size of the viewport and the scroll offset is folded into the coordinates. -->
              <canvas id="library-jelly" class="is-hidden" aria-hidden="true"></canvas>
              <div class="library-scroll" id="library-scroll">
                <div class="library-grid" id="library-grid"></div>
              </div>
              <div class="library-empty" id="library-empty" aria-hidden="true"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- Settings: the launcher's fourth surface, WHOLE — every section it has, in its order, with its
           own labels. Only the Audio rows are live; the rest carry the launcher's out-of-the-box values
           and are inert, because a web page has nothing to update, no card and no installer (see
           settings-form-model.ts). Structurally the Library's twin, with an expanded-dropdown layer of
           its own on top. -->
      <section id="settings" class="settings" aria-hidden="true">
        <div class="settings-veil"></div>
        <div class="settings-column">
          <div class="settings-header">
            <div class="settings-title">Settings</div>
            <!-- Where the launcher prints its own version: here it names the release this UI is a copy
                 of, which is the same question the number answers there. -->
            <div class="settings-version" id="settings-version"></div>
          </div>
          <!-- TWO columns: the screen's sections (and the actions that end it) on the left, the rows of
               the selected section on the right — see screen-sidebar.ts. -->
          <div class="settings-body">
            <div class="settings-nav" id="settings-nav"></div>
            <div class="settings-list" id="settings-list"></div>
          </div>
        </div>
        <!-- The dropdown's frost lives OUTSIDE the fading container: its own opacity animation would
             otherwise fade the blur along with everything else, which is the cost we are avoiding. -->
        <div class="settings-options-blur"></div>
        <!-- Expanded dropdown: a list of the focused select's options, on top of the screen. -->
        <div class="settings-options" id="settings-options" aria-hidden="true">
          <div class="settings-options-veil"></div>
          <div class="settings-options-list" id="settings-options-list"></div>
        </div>
      </section>

      <!-- Customize, in the one mode the site can offer: ADD. Structurally the Library's twin (the same
           veil + column + sidebar skeleton), whose pane holds rows rather than covers. The launcher's
           screen edits a game.json on a card; this one collects what a catalogue ENTRY is made of, and
           what it makes lives in memory until the page is reloaded. -->
      <section id="game-settings" class="settings" aria-hidden="true">
        <div class="settings-veil"></div>
        <div class="settings-column">
          <div class="settings-header">
            <div class="settings-title">Add game</div>
          </div>
          <div class="settings-body">
            <div class="settings-nav" id="game-settings-nav"></div>
            <div class="settings-list" id="game-settings-list"></div>
          </div>
          <!-- What stands between this draft and Save: it belongs to the SCREEN, not to any one section,
               so it sits under both columns and stays readable wherever the focus is. -->
          <div class="settings-status" id="game-settings-status"></div>
        </div>
      </section>

      <!-- Menu popup: ONE frosted veil + ONE right-side column (450px), same component as the launcher's,
           with one of its four views. Default focus is the BOTTOM button — see controls.ts.
           `inert` while closed: the column only fades out via opacity, so without it the buttons would
           stay in the tab order (the launcher never cared — it is a kiosk with no tab key). -->
      <section id="popup" class="popup" aria-hidden="true" data-view="details" inert>
        <!-- Two layers, on purpose: the tint fades, the frost switches on in one frame (styles.css). -->
        <div class="popup-blur"></div>
        <div class="popup-veil"></div>
        <div class="popup-column">
          <!-- Top content: the entry's play statistics, built from JS (stats.ts). Same shape as the
               launcher's info panel — and, unlike it, made up: a showcase counts no sessions. -->
          <div class="popup-content">
            <div class="popup-info" id="info-panel"></div>
            <!-- confirm: the force-close question. The launcher's confirm view also carries an
                 install-path note; nothing here is installed, so the message stands alone. -->
            <div class="popup-confirm">
              <div class="popup-message" id="confirm-message"></div>
            </div>
          </div>

          <!-- Bottom action stacks — one group per view; only the active view's group shows (CSS).
               Each is a vertical stack aligned to the right edge: a longer label grows to the LEFT,
               the right edge stays fixed. -->
          <div class="popup-actions">
            <!-- ORDER MATTERS, and it is the launcher's: the items that APPEAR AND DISAPPEAR with the
                 session (Force close, Remove from library) are at the TOP, and the ones that are always
                 there sit in a fixed block just above Close. The stack is bottom-focused and
                 bottom-anchored, so anything volatile near the bottom would shift the stable items
                 under the user's thumb between visits. -->
            <div class="actions-group" data-group="details">
              <!-- Force close: the only way out of a session. Shown while one is RUNNING and not
                   already closing down — exactly the launcher's rule (see controls.ts). -->
              <button id="menu-kill" class="text-button is-hidden" type="button">
                Force close
              </button>
              <!-- Remove from library: drops the entry the bar is describing from the catalogue — the
                   same catalogue the Library screen shows, which is what lets the launcher's own wording
                   be honest here. In the launcher it deletes a record kept on disk; here the catalogue is
                   a fetched feed, so the removal lasts until a reload (see controls.ts / PORTED-FROM.md). -->
              <button id="menu-forget" class="text-button is-hidden" type="button">
                Remove from library
              </button>
              <!-- The door to the carousel, in and out. On an entry screen it is the launcher's own
                   "Go back" — the mouse counterpart of the B button; on the landing page, where the
                   launcher has no such item, it reads "Collection" and opens the strip. The text is
                   written per route from controls.ts. Hidden only where there is no carousel to show. -->
              <button id="menu-home" class="text-button" type="button">Collection</button>
              <!-- Github: a real link, in the SAME tab. Gamepad polling is not a user activation, so a
                   scripted click on target="_blank" would be blocked as a popup — one code path for
                   mouse, keyboard and pad is worth more than a new tab. href is set per route from
                   controls.ts (the repository on home, the entry's directory on a game screen). -->
              <a id="menu-github" class="text-button" href="https://github.com/sevenns/playhook"
                >Github</a
              >
              <button id="menu-close" class="text-button" type="button">Close</button>
            </div>

            <!-- confirm: Yes/No for the force close and for removing an entry. Default focus is the
                 BOTTOM button, which is No — the safe answer, as in the launcher. -->
            <div class="actions-group" data-group="confirm">
              <button id="confirm-yes" class="text-button" type="button">Yes</button>
              <button id="confirm-no" class="text-button" type="button">No</button>
            </div>
          </div>
        </div>
      </section>

      <!-- On-screen keyboard. The launcher has no <input> anywhere and its CSS forbids a caret, so this
           is the only way to type there; here it is the GAMEPAD's way to type — a pad has no keys, and
           the site answers a pad everywhere else. A physical keyboard writes straight through it.

           It sits OUTSIDE every screen: it opens ON TOP of one, and a keyboard living inside a screen
           would be extinguished with it (the overlay rules key off data-overlay). Its own z-index puts
           it level with the screens and under the popup. -->
      <div class="osk" id="osk" aria-hidden="true">
        <div class="osk-veil"></div>
        <div class="osk-panel">
          <div class="osk-title" id="osk-title"></div>
          <!-- The value is drawn in TWO halves with the caret between them, so the caret can sit
               anywhere in the text and a click can be resolved against the half it landed in. The
               halves live inside one inline wrapper so a long value still wraps as one paragraph. -->
          <div class="osk-field" id="osk-field">
            <span class="osk-line"
              ><span id="osk-value"></span><span class="osk-caret" id="osk-caret"></span
              ><span id="osk-value-after"></span
            ></span>
          </div>
          <div class="osk-keys" id="osk-keys"></div>
          <div class="osk-legend" id="osk-legend"></div>
        </div>
      </div>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
